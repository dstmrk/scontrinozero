name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Token minimo per tutti i job (default repo più largo del necessario).
# secret-scan riottiene pull-requests: write per i commenti di gitleaks.
permissions:
  contents: read

jobs:
  # Smart skip: only run if relevant files changed
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # dorny/paths-filter lista i file delle PR via API: senza questo,
      # col blocco permissions workflow-level il job fallirebbe sulle PR.
      pull-requests: read
    outputs:
      code: ${{ steps.agg.outputs.code }}
      marketing: ${{ steps.f.outputs.marketing }}
      lockfile: ${{ steps.f.outputs.lockfile }}
      migrations: ${{ steps.f.outputs.migrations }}
      arch_docs: ${{ steps.f.outputs.arch_docs }}
      hooks: ${{ steps.f.outputs.hooks }}
      workflows: ${{ steps.f.outputs.workflows }}
      mobile: ${{ steps.f.outputs.mobile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Filtri "semplici" — predicate-quantifier di default (`some`).
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: f
        with:
          filters: |
            marketing:
              - 'src/app/(marketing)/**'
              - 'src/components/marketing/**'
            tests:
              - 'tests/**'
            # audit-ci.json decide cosa l'audit lascia passare: sta in
            # `config`, non solo in `lockfile`, così una sua modifica fa
            # girare la pipeline completa.
            config:
              - 'package.json'
              - 'package-lock.json'
              - 'audit-ci.json'
              - 'tsconfig.json'
              - 'next.config.ts'
              - 'vitest.config.ts'
              - 'eslint.config.mjs'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            lockfile:
              - 'package-lock.json'
            migrations:
              - 'supabase/migrations/**'
              - 'scripts/check-migrations.mjs'
            arch_docs:
              - 'docs/architecture/**'
              - '.claude/skills/**'
              - 'CLAUDE.md'
              - 'HAR.md'
              - 'scripts/check-architecture-docs.mjs'
              - 'src/**'
            hooks:
              - '.claude/hooks/**'
            workflows:
              - '.github/workflows/**'
            mobile:
              - 'mobile/**'
              - '.github/workflows/ci.yml'
      # Filtro "src/** escluso marketing": serve `predicate-quantifier: every`
      # per far valere le negazioni. Con `some` (default), un file marketing
      # matcherebbe comunque `src/**` e setterebbe il flag a true.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: f_src
        with:
          predicate-quantifier: every
          filters: |
            non_marketing:
              - 'src/**'
              - '!src/app/(marketing)/**'
              - '!src/components/marketing/**'
      # Aggrega un singolo flag `code` = "richiede lint+type-check+test+build".
      # true se: tests/, file di config, oppure src/ non-marketing cambiano.
      - name: Aggregate code flag
        id: agg
        run: |
          if [ "${{ steps.f.outputs.tests }}" = "true" ] \
             || [ "${{ steps.f.outputs.config }}" = "true" ] \
             || [ "${{ steps.f_src.outputs.non_marketing }}" = "true" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Verifica che tutti i file .sql siano registrati in _journal.json.
  # Gira solo quando cambia supabase/migrations/** o lo script di check.
  migrations-check:
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check migration journal consistency
        run: node scripts/check-migrations.mjs

  # Verifica che ogni path E ogni skill citati in docs/architecture/,
  # .claude/skills/ e CLAUDE.md esistano ancora (anti-drift della mappa
  # codebase, CLAUDE.md regola 26): path morti, riferimenti `skill <nome>` che
  # non risolvono, e skill non elencate da nessun indice. Gira quando cambiano
  # i doc, le skill, CLAUDE.md, lo script, o src/** (un rename in src/ può
  # orfanare un riferimento).
  arch-docs-check:
    needs: changes
    if: needs.changes.outputs.arch_docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check architecture docs references
        run: node scripts/check-architecture-docs.mjs

  # Esegue le suite di test degli hook PreToolUse/PostToolUse (.claude/hooks/).
  # Gira solo quando cambia .claude/hooks/**. Difesa-in-profondità per le
  # regole 1, 11 e 26 di CLAUDE.md: un regex che smette di bloccare push/commit
  # su main o `drizzle-kit generate`, o un hook arch-check che smette di
  # flaggare i path morti, deve fallire la CI, non passare silenzioso.
  hook-tests:
    needs: changes
    if: needs.changes.outputs.hooks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run hook test suites
        run: |
          bash .claude/hooks/test-block-push-to-main.sh
          bash .claude/hooks/test-block-drizzle-generate.sh
          bash .claude/hooks/test-block-commit-on-main.sh
          bash .claude/hooks/test-block-direct-merge.sh
          bash .claude/hooks/test-check-arch-docs-on-edit.sh

  # Scansione segreti — gira su tutti i push/PR (indipendente dal diff)
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks — secret scanning
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action v2 is still pinned to Node 20. Opt into Node 24 to
          # silence the deprecation warning until upstream ships a Node 24 build.
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

  # Lint dei file workflow — gira solo se .github/workflows/** cambia.
  # Cattura errori sintattici/logici (anche in deploy.yml & co) prima del prossimo tag.
  actionlint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download actionlint
        id: get_actionlint
        run: bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
      - name: Run actionlint
        run: ${{ steps.get_actionlint.outputs.executable }} -color

  # Audit dipendenze — gira anche su modifiche al solo lockfile.
  # audit-ci legge package-lock.json e interroga il registry npm: non gli
  # serve node_modules, quindi niente npm ci / cache. Versione pinnata
  # (un `npx audit-ci` nudo scaricherebbe l'ultima a ogni run — incoerente
  # col pinning SHA delle action, proprio sul job di security audit).
  audit:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.lockfile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Security audit
        run: npx --yes audit-ci@7.1.0 --config audit-ci.json

  # Guscio Capacitor (docs/mobile-v2.md): pacchetto npm separato, con lock,
  # tsconfig e test suoi. Niente build nativa qui — iOS richiede un runner
  # macOS — ma type-check, test del resolver di server.url e audit delle
  # dipendenze che finiscono nell'app (le devDependencies restano sul Mac).
  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install
        run: npm ci --ignore-scripts
      - name: Type check
        run: npm run type-check
      - name: Test
        run: npm test
      - name: Security audit (runtime deps)
        run: npm audit --omit=dev --audit-level=moderate

  # Parallel checks — lint, type-check e test girano in contemporanea.
  # lint e type-check girano anche su marketing-only (catturano refusi JSX/TS).
  # Lint anche su modifiche al solo mobile/: i suoi .ts li copre l'ESLint
  # root (mobile/ non ha una config sua).
  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.marketing == 'true' || needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-deps
      - name: Lint
        run: npm run lint

  type-check:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.marketing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-deps
      - name: Type check
        run: npm run type-check

  # test gira solo su modifiche a codice testabile.
  # Marketing-only viene escluso: i path sono gia' fuori da coverage (vitest.config.ts)
  # e nessun test esercita queste UI.
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-deps
      # Il gate di coverage vive qui: le soglie in vitest.config.ts (80% per
      # file su src/, rete aggregata sotto) fanno uscire il comando con 1.
      - name: Test with coverage
        run: npm run test:coverage

  # Build parte quando lint e type-check sono verdi, in parallelo a test: è un
  # check, non un deploy, e dopo test chiuderebbe la catena critica. Aspetta
  # lint e type-check (~1 min) per non spendere un build su un errore che
  # quei due trovano prima.
  build:
    needs: [changes, lint, type-check]
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.marketing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # NEXT_PUBLIC_* vars are baked into the client bundle at build time.
    # Use test values so the build succeeds in CI without production secrets.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-deps
      # Cache incrementale di Next.js (pattern ufficiale): key esatta su
      # lockfile+sorgenti, restore-key di fallback sul solo lockfile così
      # ogni build riparte dalla cache più recente compatibile.
      - name: Cache Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.2.4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'next.config.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Build
        run: npm run build
